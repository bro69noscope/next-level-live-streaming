<html>
  <head>
    <meta charset="UTF-8" />
    <title>Activity Feed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body--hide-raw">
    <div id="status" class="status">connecting...</div>
    <div id="filters" class="filters">
      <button class="filters__btn filters__btn--active" data-filter="all">
        All
      </button>
      <button class="filters__btn" data-filter="production">Production</button>
      <button class="filters__btn" data-filter="ftp">Ftp</button>
      <button id="toggleTwitchFollowsBtn" class="filters__btn">
        Hide Follows
      </button>
      <button id="toggleRawBtn" class="filters__btn">Show JSON</button>
    </div>
    <div id="feed" class="feed"></div>
    <script type="importmap">
      {
        "imports": {
          "json5": "https://esm.sh/json5@2",
          "../../common/helpers/js/dist/get-ports.js": "https://repo.local/external/common/helpers/js/dist/get-ports.js"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>

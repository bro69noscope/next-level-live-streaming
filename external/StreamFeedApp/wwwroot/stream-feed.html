<html>
  <head>
    <meta charset="UTF-8" />
    <title>Activity Feed</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="body--hide-raw">
    <div id="status" class="status">connecting...</div>

    <div id="streamFeedFilterBar" class="filterBar">
      <button class="filterBar__btn" data-sbot-instance-filter="all">
        All
      </button>
      <button class="filterBar__btn" data-sbot-instance-filter="production">
        Production
      </button>
      <button class="filterBar__btn" data-sbot-instance-filter="ftp">
        Ftp
      </button>
      <button id="toggleTwitchFollowsBtn" class="filterBar__btn">
        Hide Follows
      </button>
      <button id="toggleRawBtn" class="filterBar__btn">Show JSON</button>

      <div id="streamFeedActionBar" class="actionBar">
        <button id="loadHistoryBtn" class="actionBar__btn">Load History</button>
        <button id="clearFeedBtn" class="actionBar__btn">Clear Feed</button>
      </div>
    </div>

    <div id="feed" class="feed"></div>

    <template id="feed-entry-template">
      <div class="feed__entry">
        <div class="feed__entry-icon"></div>
        <div class="feed__entry-body">
          <div class="feed__entry-header">
            <span class="feed__entry-instance"></span>
            <span class="feed__entry-timestamp"></span>
            <b class="feed__entry-user"></b>
            <span class="feed__entry-label"></span>
            <button class="feed__entry-replay" title="Replay alert">󰑙</button>
          </div>
          <div class="feed__entry-detail"></div>
          <div class="feed__entry-message"></div>
          <div class="feed__entry-raw"></div>
        </div>
      </div>
    </template>

    <script type="importmap">
      {
        "imports": {
          "json5": "https://esm.sh/json5@2",
          "../../common/helpers/js/dist/get-ports.js": "https://repo.local/external/common/helpers/js/dist/get-ports.js"
        }
      }
    </script>

    <script type="module" src="main.js"></script>
  </body>
</html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Combined Alert Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .overlay-frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <iframe
      class="overlay-frame"
      src="twitch/twitch-alerts.html"
      title="Twitch alert overlay"
      allow="autoplay"
    ></iframe>

    <iframe
      class="overlay-frame"
      src="kofi/kofi-alerts.html"
      title="Ko-fi alert overlay"
      allow="autoplay"
    ></iframe>

    <script>
      let locked = false;
      const waiting = [];

      window.addEventListener("message", (evt) => {
        const data = evt.data;
        if (!data || !data.type) return;

        if (data.type === "alert-lock-request") {
          waiting.push(evt.source);
          grantNext();
        } else if (data.type === "alert-lock-release") {
          locked = false;
          grantNext();
        }
      });

      function grantNext() {
        if (locked || waiting.length === 0) return;
        locked = true;
        const source = waiting.shift();
        source.postMessage({ type: "alert-lock-granted" }, "*");
      }
    </script>
  </body>
</html>
